<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitesterva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновый холст для звезд -->
    <canvas></canvas>

    <div class="container">

        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="top-section">

            <!-- Главная 3D карточка -->
            <div class="parent">
                <div class="card-hero">
                    <div class="content-box">
                        <span class="card-title">Sitesterva</span>
                        <p class="card-content">Индивидуальные цифровые арты, дизайн и современные веб-решения под ваши задачи.</p>
                    </div>
                </div>
            </div>

            <!-- Правая панель (Прайс + Соцсети + Кнопка) -->
            <div class="right-panel">

                <!-- Карточка прайса -->
                <div class="price-card">
                    <div class="card2">
                        <div class="price-content-wrapper">
                            <div class="price-default">Прайс</div>
                            <div class="price-hover">
                                <h3>Стоимость</h3>
                                <p>Базовый арт от 1500₽.<br>Срок выполнения от 2 дней.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Правая колонка: Соцсети и Кнопка -->
                <div class="right-column">

                    <!-- Соцсети -->
                    <ul class="example-2">
                      <li class="icon-content" data-social="discord">
                        <a aria-label="Discord" href="https://discord.com/" target="_blank">
                          <div class="filled"></div>
                          <svg viewBox="0 0 127.14 96.36" version="1.1">
                            <path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.62-27.28-4.48-51.2-19.53-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
                          </svg>
                        </a>
                        <div class="tooltip">Discord</div>
                      </li>

                      <li class="icon-content" data-social="twitter">
                        <a aria-label="Twitter" href="https://twitter.com/" target="_blank">
                          <div class="filled"></div>
                          <svg viewBox="0 0 24 24" version="1.1">
                            <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                          </svg>
                        </a>
                        <div class="tooltip">Twitter</div>
                      </li>

                      <!-- Точный логотип DeviantArt (современная Z) -->
                      <li class="icon-content" data-social="deviantart">
                          <a aria-label="DeviantArt" href="https://www.deviantart.com/" target="_blank">
                               <div class="filled"></div>
                               <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path fill="currentColor" d="M19.22 0H14.1l-1.34 2.6-3.9 7.55H4.2v4.8h4.67l-1.2 2.32-1.42 2.76v6.33h5.12l1.32-2.6 3.9-7.55h4.66v-4.8h-4.66l1.2-2.32 1.43-2.76V0z"/>
                               </svg>
                            </a>
                            <div class="tooltip">DeviantArt</div>
                      </li>

                      <li class="icon-content" data-social="telegram">
                        <a aria-label="Telegram" href="https://telegram.org/" target="_blank">
                          <div class="filled"></div>
                          <svg viewBox="0 0 100 100" version="1.1">
                            <path fill="currentColor" d="M95,9.9c-1.3-1.1-3.4-1.2-7-0.1c0,0,0,0,0,0c-2.5,0.8-24.7,9.2-44.3,17.3c-17.6,7.3-31.9,13.7-33.6,14.5 c-1.9,0.6-6,2.4-6.2,5.2c-0.1,1.8,1.4,3.4,4.3,4.7c3.1,1.6,16.8,6.2,19.7,7.1c1,3.4,6.9,23.3,7.2,24.5c0.4,1.8,1.6,2.8,2.2,3.2 c0.1,0.1,0.3,0.3,0.5,0.4c0.3,0.2,0.7,0.3,1.2,0.3c0.7,0,1.5-0.3,2.2-0.8c3.7-3,10.1-9.7,11.9-11.6c7.9,6.2,16.5,13.1,17.3,13.9 c0,0,0.1,0.1,0.1,0.1c1.9,1.6,3.9,2.5,5.7,2.5c0.6,0,1.2-0.1,1.8-0.3c2.1-0.7,3.6-2.7,4.1-5.4c0-0.1,0.1-0.5,0.3-1.2 c3.4-14.8,6.1-27.8,8.3-38.7c2.1-10.7,3.8-21.2,4.8-26.8c0.2-1.4,0.4-2.5,0.5-3.2C96.3,13.5,96.5,11.2,95,9.9z M30,58.3l47.7-31.6 c0.1-0.1,0.3-0.2,0.4-0.3c0,0,0,0,0,0c0.1,0,0.1-0.1,0.2-0.1c0.1,0,0.1,0,0.2-0.1c-0.1,0.1-0.2,0.4-0.4,0.6L66,38.1 c-8.4,7.7-19.4,17.8-26.7,24.4c0,0,0,0,0,0.1c0,0-0.1,0.1-0.1,0.1c0,0,0,0.1-0.1,0.1c0,0.1,0,0.1-0.1,0.2c0,0,0,0.1,0,0.1 c0,0,0,0,0,0.1c-0.5,5.6-1.4,15.2-1.8,19.5c0,0,0,0,0-0.1C36.8,81.4,31.2,62.3,30,58.3z"></path>
                          </svg>
                        </a>
                        <div class="tooltip">Telegram</div>
                      </li>
                    </ul>

                    <!-- Кнопка «Заказать арт» -->
                    <a href="#" class="button" style="--clr: #07b9ff">
                      <span class="button__icon-wrapper">
                        <svg viewBox="0 0 14 15" fill="none" width="10" height="10" class="button__icon-svg" xmlns="http://www.w3.org/2000/svg">
                          <path d="M13.376 11.552l-.264-10.4-10.4-.248.024 2.28 6.736.148L.556 10.792l1.608 1.608 7.392-7.392.148 6.736 2.272.024z" fill="currentColor"></path>
                        </svg>
                        <svg viewBox="0 0 14 15" fill="none" width="10" height="10" class="button__icon-svg button__icon-svg--copy" xmlns="http://www.w3.org/2000/svg">
                          <path d="M13.376 11.552l-.264-10.4-10.4-.248.024 2.28 6.736.148L.556 10.792l1.608 1.608 7.392-7.392.148 6.736 2.272.024z" fill="currentColor"></path>
                        </svg>
                      </span>
                      Заказать арт
                    </a>

                </div>
            </div>

        </div>

        <!-- НИЖНЯЯ ГАЛЕРЕЯ (КАРУСЕЛЬ) -->
        <div class="bottom-gallery-section">
            <button class="scroll-btn left-btn" id="scrollLeft">&#10094;</button>
            <div class="gallery-track-container" id="galleryContainer">
                <div class="gallery-track" id="galleryTrack">
                    <!-- Карточки генерируются динамически через script.js -->
                </div>
            </div>
            <button class="scroll-btn right-btn" id="scrollRight">&#10095;</button>
        </div>

        <!-- ИНТЕРАКТИВНОЕ РАЗДЕЛЕНИЕ ЭКРАНА (при клике на арт) -->
        <div class="active-view-container">
            <div class="big-preview-box">
                <img id="big-preview-img" src="" alt="Big Preview">
                <button class="close-view-btn">Закрыть</button>
            </div>
        </div>

    </div>

    <!-- Скрипты -->
    <script src="stars.js"></script>
    <script src="script.js"></script>
</body>
</html>
